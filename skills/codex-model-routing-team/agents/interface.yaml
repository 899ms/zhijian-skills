interface:
  display_name: "Codex 模型路由团队"
  short_description: "轻量 TeamPlan 调度 Luna XHigh/Max Worker"
  default_prompt: "使用 $codex-model-routing-team 判断净收益、编译 TeamPlan，再为各单元固定精确路由，由主 Agent 集成验收。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
  activation:
    mode: "implicit-with-standing-user-authorization"
    paths: []
  execution:
    context: "fork"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "deny"
  degradation:
    openai: "Default to Luna XHigh/Max App Fast when live priority evidence exists. Sol/Terra default Standard but may use explicit Fast with live evidence. TeamPlan scales from standard 6/8/3 to justified expanded 12/16/6."
