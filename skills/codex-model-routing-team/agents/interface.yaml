interface:
  display_name: "Codex 模型路由团队"
  short_description: "为复杂任务路由原生 Subagent 或耐久 App Thread"
  default_prompt: "使用 $codex-model-routing-team 判断并行收益，固定 Surface、模型、推理、速度、Provider 门和候选链，由主 Agent 集成验收。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
  activation:
    mode: "implicit-with-standing-user-authorization"
    paths: []
  execution:
    context: "fork"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "deny"
  degradation:
    openai: "Require a live exact route; Fast requires service_tier=priority. Use App threads for durable/worktree tasks, otherwise execute in the lead task."
