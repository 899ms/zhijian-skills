<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" data-composition="oauth-sse-image-pipeline">
  <title id="title">Codex Image Gen</title>
  <desc id="desc">A logged-in Codex CLI OAuth file streams image_generation results into local PNG files for any Agent.</desc>
  <rect width="1200" height="360" rx="28" fill="#191B2E"/>
  <g data-composition="oauth-sse-image-pipeline"><text x="48" y="55" fill="#8B7CF7" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="700" letter-spacing="1.8">LOCAL OAUTH → IMAGE GENERATION</text><text x="48" y="118" fill="#F4F2EC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="52" font-weight="760" >Codex</text><text x="48" y="170" fill="#F4F2EC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="52" font-weight="760" >Image Gen</text><text x="48" y="212" fill="#A9ADD3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="480" >One login. Every Agent. No API key.</text><rect x="48" y="250" width="352" height="46" rx="7" fill="#242748" stroke="#8B7CF7" stroke-width="2" /><text x="68" y="280" fill="#F4F2EC" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="700" >TEXT-TO-IMAGE • EDIT • SSE → PNG</text><text x="48" y="334" fill="#75D39B" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="650" >uses your existing codex account quota</text><line x1="432" y1="42" x2="432" y2="318" stroke="#343858" stroke-width="2" /><text x="460" y="46" fill="#A9ADD3" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="700" letter-spacing="1.5">OAUTH-REUSE PIPELINE</text><rect x="460" y="64" width="205" height="88" rx="9" fill="#242748" stroke="#8B7CF7" stroke-width="2" /><text x="562.5" y="90" fill="#F4F2EC" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="750" text-anchor="middle">AUTH FILE</text><text x="562.5" y="114" fill="#A9ADD3" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="650" text-anchor="middle">~/.codex/auth.json</text><text x="562.5" y="138" fill="#A9ADD3" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">access + refresh</text><rect x="460" y="170" width="205" height="30" rx="6" fill="#242748" stroke="#F2A65A" stroke-width="2" /><text x="562.5" y="190" fill="#F2A65A" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="650" text-anchor="middle">JWT exp → auto-refresh</text><rect x="700" y="64" width="205" height="88" rx="9" fill="#242748" stroke="#8B7CF7" stroke-width="2" /><text x="802.5" y="90" fill="#F4F2EC" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="750" text-anchor="middle">CODEX SSE</text><text x="802.5" y="114" fill="#A9ADD3" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="650" text-anchor="middle">POST /codex/responses</text><text x="802.5" y="138" fill="#A9ADD3" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">image_generation tool</text><rect x="700" y="170" width="205" height="30" rx="6" fill="#242748" stroke="#8B7CF7" stroke-width="2" /><text x="802.5" y="190" fill="#8B7CF7" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="650" text-anchor="middle">UA · originator · ID</text><rect x="940" y="64" width="212" height="88" rx="9" fill="#242748" stroke="#8B7CF7" stroke-width="2" /><text x="1046.0" y="90" fill="#F4F2EC" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="750" text-anchor="middle">EXTRACT</text><text x="1046.0" y="114" fill="#A9ADD3" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="650" text-anchor="middle">image_generation_call</text><text x="1046.0" y="138" fill="#A9ADD3" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">base64 → bytes</text><rect x="940" y="170" width="212" height="30" rx="6" fill="#242748" stroke="#A9ADD3" stroke-width="2" /><text x="1046.0" y="190" fill="#A9ADD3" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="650" text-anchor="middle">partial-image fallback</text><line x1="665" y1="108" x2="700" y2="108" stroke="#454A6E" stroke-width="3" /><path d="M686 96 L700 108 L686 120" fill="none" stroke="#8B7CF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="905" y1="108" x2="940" y2="108" stroke="#454A6E" stroke-width="3" /><path d="M926 96 L940 108 L926 120" fill="none" stroke="#8B7CF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="218" width="692" height="100" rx="10" fill="#F4F2EC" stroke="none" stroke-width="1" /><rect x="478" y="234" width="148" height="68" rx="6" fill="#DCE6F4" stroke="none" stroke-width="1" /><circle cx="596" cy="254" r="9" fill="#F2A65A" stroke="none" stroke-width="1" /><path d="M478 302 L516 270 L542 291 L572 260 L626 302 Z" fill="#43507A" stroke="none" stroke-width="1" /><text x="650" y="258" fill="#23263B" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="700" >codex-image-20260818-1010-9f2c1a7b.png</text><text x="650" y="284" fill="#4A4E6A" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="650" >{"success": true, "image": "…/cover.png"}</text><circle cx="659" cy="303" r="7" fill="#75D39B" stroke="none" stroke-width="1" /><text x="676" y="308" fill="#2F8F5B" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="750" >NO API KEY  •  ACCOUNT QUOTA</text></g>
</svg>
