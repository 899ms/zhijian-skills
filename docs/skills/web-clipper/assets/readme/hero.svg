<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" data-composition="fallback-clipping-funnel">
  <title id="title">Web Clipper</title>
  <desc id="desc">Single article and archive-page inputs flow through layered extractors into source-aware Markdown.</desc>
  <rect width="1200" height="360" rx="28" fill="#112A33"/>
  <g data-composition="fallback-clipping-funnel"><text x="48" y="50" fill="#55C7D8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="800" letter-spacing="1.8">AGENT-NATIVE WEB ARCHIVING</text><text x="48" y="108" fill="#F7F2E8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="52" font-weight="760" >Web</text><text x="48" y="162" fill="#F7F2E8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="52" font-weight="760" >Clipper</text><text x="48" y="206" fill="#A8C1C8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21" font-weight="500" >Public pages become traceable Markdown.</text><rect x="48" y="248" width="338" height="48" rx="7" fill="#193A45" stroke="#55C7D8" stroke-width="2" /><text x="68" y="279" fill="#F7F2E8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="800" >SINGLE  •  BATCH  •  FALLBACK</text><text x="48" y="330" fill="#75D39B" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="700" >browser finds links  →  script writes files</text><rect x="450" y="44" width="170" height="58" rx="8" fill="#193A45" stroke="#55C7D8" stroke-width="2" /><text x="535" y="69" fill="#F7F2E8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="800" text-anchor="middle">ARTICLE URL</text><text x="535" y="89" fill="#A8C1C8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="650" text-anchor="middle">single</text><rect x="450" y="124" width="170" height="58" rx="8" fill="#193A45" stroke="#F2A65A" stroke-width="2" /><text x="535" y="149" fill="#F7F2E8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="800" text-anchor="middle">ARCHIVE PAGE</text><text x="535" y="169" fill="#A8C1C8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="650" text-anchor="middle">bounded batch</text><line x1="620" y1="73" x2="682" y2="146" stroke="#456876" stroke-width="3" /><line x1="620" y1="153" x2="682" y2="146" stroke="#456876" stroke-width="3" /><path d="M668 134 L682 146 L666 155" fill="none" stroke="#55C7D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="752" y="62" fill="#A8C1C8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="800" text-anchor="middle">EXTRACTOR ROUTER</text><rect x="680" y="82" width="180" height="32" rx="5" fill="#193A45" stroke="#55C7D8" stroke-width="2" /><text x="770" y="104" fill="#F7F2E8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="800" text-anchor="middle">STATIC</text><rect x="680" y="124" width="180" height="32" rx="5" fill="#193A45" stroke="#75D39B" stroke-width="2" /><text x="770" y="146" fill="#F7F2E8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="800" text-anchor="middle">DEFUDDLE</text><rect x="680" y="166" width="180" height="32" rx="5" fill="#193A45" stroke="#F2A65A" stroke-width="2" /><text x="770" y="188" fill="#F7F2E8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="800" text-anchor="middle">JINA</text><rect x="680" y="208" width="180" height="32" rx="5" fill="#193A45" stroke="#F2A65A" stroke-width="2" /><text x="770" y="230" fill="#F7F2E8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="800" text-anchor="middle">METASO</text><rect x="680" y="250" width="180" height="32" rx="5" fill="#193A45" stroke="#55C7D8" stroke-width="2" /><text x="770" y="272" fill="#F7F2E8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="800" text-anchor="middle">BROWSER / CDP</text><line x1="860" y1="146" x2="918" y2="174" stroke="#75D39B" stroke-width="4" /><path d="M902 162 L918 174 L900 181" fill="none" stroke="#75D39B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="936" y="52" width="214" height="256" rx="10" fill="#F7F2E8" stroke="none" stroke-width="1" /><rect x="936" y="52" width="214" height="38" rx="9" fill="#75D39B" stroke="none" stroke-width="1" /><text x="954" y="78" fill="#112A33" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="850" >YYYY-MM-DD title.md</text><text x="958" y="118" fill="#112A33" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="750" >---</text><text x="958" y="145" fill="#112A33" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="650" >source: https://…</text><text x="958" y="170" fill="#112A33" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="650" >extractor: jina</text><text x="958" y="195" fill="#112A33" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="650" >status: unprocessed</text><text x="958" y="220" fill="#112A33" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="750" >---</text><text x="958" y="254" fill="#112A33" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="800" ># Article title</text><line x1="958" y1="272" x2="1128" y2="272" stroke="#B8C4C5" stroke-width="4" /><line x1="958" y1="288" x2="1096" y2="288" stroke="#B8C4C5" stroke-width="4" /><circle cx="1124" cy="327" r="9" fill="#75D39B" stroke="none" stroke-width="1" /><text x="1104" y="332" fill="#75D39B" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="850" text-anchor="end">RECORDED</text></g>
</svg>
