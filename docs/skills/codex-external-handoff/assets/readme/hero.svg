<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" data-composition="external-appserver-thread-loop">
  <title id="title">Codex External Handoff</title>
  <desc id="desc">Launch and supervise persistent, user-visible Codex App Server threads from external agents with structured callbacks.</desc>
  <rect width="1200" height="360" rx="28" fill="#0B1528"/>
  <g data-composition="external-appserver-thread-loop"><text x="52" y="55" fill="#38BDF8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2">CROSS-AGENT / APP SERVER</text><text x="52" y="118" fill="#F5F8FA" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="46" font-weight="720" >Codex External</text><text x="52" y="168" fill="#F5F8FA" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="46" font-weight="720" >Handoff</text><text x="52" y="212" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="450" >Launch &amp; supervise persistent threads.</text><rect x="52" y="254" width="370" height="48" rx="8" fill="#13233D" stroke="#38BDF8" stroke-width="2" /><text x="70" y="284" fill="#F5F8FA" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="700" >WORKBUDDY / CLAUDE  →  CODEX</text><rect x="490" y="48" width="185" height="118" rx="10" fill="#13233D" stroke="#334155" stroke-width="2" /><rect x="490" y="48" width="185" height="28" rx="10" fill="#1E293B" stroke="none" stroke-width="1" /><text x="582" y="67" fill="#38BDF8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700" text-anchor="middle">EXTERNAL AGENT</text><text x="505" y="96" fill="#F5F8FA" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" font-weight="500" >• WorkBuddy / Claude</text><text x="505" y="118" fill="#94A3B8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="500" >• ask --task-file ...</text><text x="505" y="140" fill="#4ADE80" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="600" >• sandbox=read-only</text><line x1="675" y1="107" x2="720" y2="107" stroke="#38BDF8" stroke-width="2" /><text x="697" y="98" fill="#38BDF8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">stdio</text><rect x="720" y="48" width="195" height="118" rx="10" fill="#13233D" stroke="#38BDF8" stroke-width="2" /><rect x="720" y="48" width="195" height="28" rx="10" fill="#1E293B" stroke="none" stroke-width="1" /><text x="817" y="67" fill="#38BDF8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700" text-anchor="middle">CODEX APP SERVER</text><text x="735" y="96" fill="#F5F8FA" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="600" >→ thread/start</text><text x="735" y="118" fill="#F5F8FA" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="600" >→ thread/name/set</text><text x="735" y="140" fill="#F5F8FA" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="600" >→ turn/start</text><line x1="915" y1="107" x2="955" y2="107" stroke="#A78BFA" stroke-width="2" /><rect x="955" y="48" width="195" height="118" rx="10" fill="#13233D" stroke="#A78BFA" stroke-width="2" /><rect x="955" y="48" width="195" height="28" rx="10" fill="#2E1065" stroke="none" stroke-width="1" /><text x="1052" y="67" fill="#A78BFA" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700" text-anchor="middle">PERSISTENT THREAD</text><text x="970" y="96" fill="#E2E8F0" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="11" font-weight="500" >✓ codex://threads/...</text><text x="970" y="118" fill="#E2E8F0" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="11" font-weight="500" >✓ codex resume ...</text><text x="970" y="140" fill="#A78BFA" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="11" font-weight="600" >✓ Desktop Takeover</text><path d="M1052 166 L1052 205 L965 205" fill="none" stroke="#4ADE80" stroke-width="2" /><rect x="490" y="190" width="475" height="122" rx="10" fill="#13233D" stroke="#4ADE80" stroke-width="2" /><rect x="490" y="190" width="475" height="28" rx="10" fill="#064E3B" stroke="none" stroke-width="1" /><text x="727" y="209" fill="#4ADE80" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700" text-anchor="middle">STRUCTURED CALLBACK &amp; RECEIPT</text><text x="505" y="238" fill="#F5F8FA" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="600" >• status: completed</text><text x="505" y="260" fill="#94A3B8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="500" >• conclusion + evidence[]</text><text x="505" y="282" fill="#94A3B8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="500" >• risks[] + artifacts[]</text><text x="730" y="238" fill="#94A3B8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="500" >• job receipt ~/.codex/...</text><text x="730" y="260" fill="#4ADE80" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="600" >• result / continue / open</text><text x="730" y="282" fill="#94A3B8" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="500" >• clean request purge</text><path d="M490 251 L460 251 L460 107 L490 107" fill="none" stroke="#4ADE80" stroke-width="2" /></g>
</svg>
